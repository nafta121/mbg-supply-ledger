#:schema node_modules/wrangler/config-schema.json
name = "mbg-supply-ledger"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[assets]
directory = "./out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.2
persist = true

[[durable_objects.bindings]]
name = "MBG_SYNC_HUB"
class_name = "MbgSyncHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MbgSyncHub"]

[[d1_databases]]
binding = "DB"
database_name = "mbg-supply-ledger-db"
database_id = "627d7c29-483f-4a45-a487-1fe0f277ddae"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MBG_STORAGE"
bucket_name = "mbg-supply-ledger-files"
